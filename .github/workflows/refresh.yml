name: Refresh model & dashboard data

on:
  schedule:
    - cron: "0 12 1 * *"  # 1st of each month, 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: src
        run: |
          python universe.py
          python ingest.py
          python features.py
          python labels.py
          python backtest.py
          python shap_explain.py
          python predict.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/universe.csv docs/rankings.json docs/shap_values.json docs/backtest_history.json
          git diff --cached --quiet || git commit -m "Automated data refresh $(date -u +%Y-%m-%d)"
          git push
